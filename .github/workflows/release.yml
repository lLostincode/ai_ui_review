name: Release

# Publishes a GitHub Release whenever manifest.json carries a version that has
# not been released yet. To release: bump "version" in manifest.json (and
# package.json), add a CHANGELOG.md section for it, and push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22

      - name: Test
        if: steps.version.outputs.exists == 'false'
        run: npm test

      - name: Package
        if: steps.version.outputs.exists == 'false'
        run: node tools/package.mjs

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        run: |
          gh release create "$TAG" "dist/web-feedback-cr-$TAG.zip" \
            --target "$GITHUB_SHA" \
            --title "Web Feedback CR $TAG" \
            --notes-file dist/RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
