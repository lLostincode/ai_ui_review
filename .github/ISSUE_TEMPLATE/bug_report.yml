name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open http://localhost:3000/settings
        2. Toggle the overlay, click + Frame
        3. …
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131 on macOS 15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors
      description: From the page console or the service worker (chrome://extensions → Inspect views).
      render: text
